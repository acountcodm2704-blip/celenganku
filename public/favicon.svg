<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" rx="18" fill="#FDF1E5"/>

  <!-- Hard shadow (neo-brutalism offset) -->
  <g transform="translate(4,4)">
    <ellipse cx="50" cy="58" rx="30" ry="24" fill="#000000"/>
  </g>

  <!-- Body -->
  <ellipse cx="50" cy="58" rx="30" ry="24" fill="#FFDD70" stroke="#000000" stroke-width="4.5"/>

  <!-- Coin slot -->
  <rect x="40" y="28" width="20" height="7" rx="3.5" fill="#000000"/>

  <!-- Comb (crown) -->
  <path d="M38 32 L42 20 L47 30 L52 18 L57 30 L62 20 L66 32 Z"
        fill="#FE98A3" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Beak -->
  <path d="M50 44 L60 40 L60 50 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Wattle -->
  <circle cx="52" cy="52" r="5" fill="#FE98A3" stroke="#000000" stroke-width="3.5"/>

  <!-- Eye -->
  <circle cx="42" cy="44" r="4" fill="#000000"/>
  <circle cx="43.3" cy="42.7" r="1.3" fill="#FFFFFF"/>

  <!-- Wing -->
  <path d="M28 55 Q40 50 34 72 Q24 68 28 55 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Feet -->
  <path d="M40 80 L38 90 M40 80 L43 90" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M62 80 L60 90 M62 80 L65 90" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Tail feathers -->
  <path d="M76 46 L86 36 M78 52 L90 46 M76 58 L88 56"
        stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</svg>
